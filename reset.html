<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><title>Reset aktualizacji UDT Trainer</title>
<style>body{font-family:system-ui;background:#0f1115;color:#f4f4f4;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{max-width:560px;background:#191c23;border:1px solid #353946;border-radius:24px;padding:28px}button{width:100%;padding:16px;border:0;border-radius:16px;background:#ffd51f;font-weight:800;font-size:18px}.ok{color:#56e39f}.bad{color:#ff7b7b}</style></head>
<body><main class="box"><h1>Naprawa aktualizacji</h1><p>Ta strona usuwa stare cache PWA i wyrejestrowuje poprzednie Service Workery. Nie usuwa postępów zapisanych w localStorage.</p><button id="go">Wyczyść starą wersję i uruchom aplikację</button><p id="status"></p></main>
<script>
document.getElementById('go').onclick=async()=>{const s=document.getElementById('status');try{s.textContent='Czyszczenie…';const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.unregister()));const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));s.className='ok';s.textContent='Gotowe. Uruchamiam świeżą wersję…';setTimeout(()=>location.replace('./index.html?fresh=620h2'),700)}catch(e){s.className='bad';s.textContent='Błąd: '+e.message}}</script></body></html>
